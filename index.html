<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>רועי להב · מחברת</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#EA580C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="מחברת">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-pen" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></symbol>
    <symbol id="i-hi" viewBox="0 0 24 24"><path d="m9 11-6 6v3h9l3-3"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></symbol>
    <symbol id="i-eraser" viewBox="0 0 24 24"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></symbol>
    <symbol id="i-redo" viewBox="0 0 24 24"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></symbol>
    <symbol id="i-folder-plus" viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/><path d="M12 10v6"/><path d="M9 13h6"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 2 10 5-10 5L2 7Z"/><path d="m2 12 10 5 10-5"/><path d="m2 17 10 5 10-5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M9 3v18"/><path d="M15 3v18"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 21h14"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-hand" viewBox="0 0 24 24"><path d="M18 11V6a2 2 0 0 0-4 0v1"/><path d="M14 10V4a2 2 0 0 0-4 0v2"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.9-5.9-2.4L3.4 16a2 2 0 0 1 3.2-2.4L8 15"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></symbol>
    <symbol id="i-pencil-logo" viewBox="0 0 24 24"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></symbol>
  </defs>
</svg>

<div id="app" class="nav-open">

  <header id="top">
    <button id="navToggle" class="ibtn light" aria-label="תפריט תיקיות"><svg class="ic"><use href="#i-menu"/></svg></button>
    <div class="brand">
      <div class="logo"><svg class="ic"><use href="#i-pencil-logo"/></svg></div>
      <div class="brandtxt">
        <div class="name">רועי להב</div>
        <div class="sub">מחברת דיונים</div>
      </div>
    </div>
    <div class="grow"></div>
    <div id="status" class="status saved"><svg class="ic"><use href="#i-check"/></svg><span>נשמר אוטומטית</span></div>
  </header>

  <div id="body">
    <div id="scrim"></div>

    <nav id="nav">
      <div class="navin">
        <aside id="folders">
          <div class="sect">תיקיות</div>
          <div id="folderList"></div>
          <button id="addFolder" class="addrow"><svg class="ic"><use href="#i-folder-plus"/></svg><span>תיקייה חדשה</span></button>
          <div class="grow"></div>
          <button id="backupBtn" class="addrow subtle"><svg class="ic"><use href="#i-save"/></svg><span>גיבוי ושחזור</span></button>
        </aside>

        <section id="notesPane">
          <div class="nhead">
            <div>
              <h2 id="folderTitle">כל ההערות</h2>
              <div id="folderCount" class="muted"></div>
            </div>
            <button id="newNote" class="primary"><svg class="ic"><use href="#i-plus"/></svg><span>הערה חדשה</span></button>
          </div>
          <label class="search"><svg class="ic"><use href="#i-search"/></svg><input id="search" type="search" placeholder="חיפוש הערה…" autocomplete="off"></label>
          <div id="noteList"></div>
        </section>
      </div>
    </nav>

    <main id="editor">
      <div id="etop">
        <input id="title" type="text" maxlength="120" placeholder="כותרת ההערה" autocomplete="off">
        <button id="folderChip" class="chip"><svg class="ic"><use href="#i-folder"/></svg><span id="folderChipTxt">כללי</span></button>
        <button id="moreBtn" class="ibtn" aria-label="עוד"><svg class="ic"><use href="#i-more"/></svg></button>
      </div>

      <div id="tools">
        <div class="grp">
          <button class="tbtn" data-tool="pen" aria-label="עט"><svg class="ic"><use href="#i-pen"/></svg></button>
          <button class="tbtn" data-tool="hi" aria-label="מרקר"><svg class="ic"><use href="#i-hi"/></svg></button>
          <button class="tbtn" data-tool="eraser" aria-label="מחק"><svg class="ic"><use href="#i-eraser"/></svg></button>
        </div>
        <div class="sep"></div>
        <div class="grp" id="swatches"></div>
        <div class="sep"></div>
        <div class="grp" id="sizes"></div>
        <div class="sep"></div>
        <div class="grp">
          <button id="undoBtn" class="tbtn" aria-label="בטל"><svg class="ic"><use href="#i-undo"/></svg></button>
          <button id="redoBtn" class="tbtn" aria-label="חזור"><svg class="ic"><use href="#i-redo"/></svg></button>
        </div>
        <div class="sep"></div>
        <div class="grp">
          <button id="paperBtn" class="tbtn" aria-label="סוג נייר"><svg class="ic"><use href="#i-grid"/></svg></button>
          <button id="penOnlyBtn" class="tbtn wide" aria-label="עט בלבד"><svg class="ic"><use href="#i-hand"/></svg><span>אצבע גוללת</span></button>
        </div>
      </div>

      <div id="canvasWrap">
        <canvas id="ink"></canvas>
        <canvas id="live"></canvas>
        <div id="sbar"></div>
      </div>
    </main>
  </div>

  <div id="toast"></div>
  <div id="modal"></div>
  <input id="importFile" type="file" accept="application/json,.json" hidden>
</div>

<script src="app.js"></script>
</body>
</html>
